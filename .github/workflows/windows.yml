name: Windows OS compilation-

on:
  push:
  pull_request:
    branches: [ "main" ]

jobs:
  win_nightly:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    - uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW32
        update: true
        install: >-
          make
          patch
          git
          mingw-w64-i686-cmake
          mingw-w64-i686-gcc
          mingw-w64-i686-libgomp
    - shell: msys2 {0}
      run: |
        uname -a
        make .build main_build make_luajitw tools_build TC=gcc CPU_CORE_BITS=32bit RESOURCE_FILE=res/rscVcc.res
        
