name: Windows OS compilation-

on:
  push:
  pull_request:
    branches: [ "main" ]

jobs:
  win_nightly:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    - uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW32
        update: true
        install: >-
          make
          patch
          git
          mingw-w64-i686-cmake
          mingw-w64-i686-gcc
          mingw-w64-i686-libgomp
    - shell: msys2 {0}
      run: |
        uname -a
        bash tools/install_i686_archived_packages.sh
        rm -f bin/*.dll
        make .build main_build make_luajitw tools_build copy_dll TC=gcc CPU_CORE_BITS=32bit DLL_SOURCE_DIR=/mingw32/bin FREETYPE_DLL_SOURCE_DIR=/mingw32/bin RESOURCE_FILE=res/rscVcc.res
        gcc -shared -O2 -o bin/stb_image.dll tools/stb_image_dll.c
        for dll in \
          libbrotlicommon.dll libbrotlidec.dll libbz2-1.dll libfreetype-6.dll \
          libffi-8.dll libgcc_s_dw2-1.dll libglib-2.0-0.dll libgraphite2.dll \
          libharfbuzz-0.dll libiconv-2.dll libintl-8.dll libpcre2-8-0.dll \
          libpng16-16.dll libsamplerate-0.dll libstdc++-6.dll zlib1.dll; do
          test -f "bin/$dll" || { echo "Missing required 32-bit dependency: $dll"; exit 1; }
        done
        test -f /mingw32/include/freetype2/ft2build.h
        test -f /mingw32/include/stb/stb_image.h
        for dll in bin/*.dll; do
          objdump -f "$dll" | grep -Eq 'architecture: i386([,[:space:]]|$)' || { echo "Not a 32-bit DLL: $dll"; exit 1; }
        done
        objdump -p bin/stb_image.dll | grep -Eq '[[:space:]]stbi_load$' || { echo "Missing stb_image exports"; exit 1; }
        for dll in bin/cimgui_glfw.dll bin/cimgui_sdl.dll bin/cimgui_sdl3.dll; do
          for symbol in ImPlot_PlotLineG_Ptr ImPlot_PlotLine_FloatPtrFloatPtr_Ptr ImPlot3D_PlotLine_FloatPtr_Ptr; do
            objdump -p "$dll" | grep "$symbol" >/dev/null || { echo "Missing $symbol in $dll"; exit 1; }
          done
        done
        grep -Fq 'return M.ImPlot_PlotLineG_LJ(label_id,getter,data,count,spec)' bin/lua/imgui/glfw.lua
        grep -Fq 'int ImPlot_PlotLineG_Ptr(' bin/lua/imgui/cdefs.lua
        grep -Fq 'return check_plot_shim(lib.ImPlot3D_PlotLine_FloatPtr_Ptr(label_id,xs,ys,zs,count,spec_ptr))' bin/lua/imgui/glfw.lua
        grep -Fq 'return M.ImPlot3D_PlotLine_FloatPtr(a1,a2,a3,a4,a5,a6)' bin/lua/imgui/glfw.lua
        grep -Fq 'int ImPlot3D_PlotLine_FloatPtr_Ptr(' bin/lua/imgui/cdefs.lua
    - uses: actions/upload-artifact@v4
      with:
        name: luajit-imgui-windows-32bit
        path: bin/
        if-no-files-found: error
